<div class="factory-config-section mb-4" data-bind="debug: 'Factory Config Section', with: $data">
    <table class="table table-striped table-fixed">
        <tbody>
            <tr>
                <!-- constructed buildings and supplier button -->
                <td>
                    <div data-bind="text: $data.name()"></div>  
                </td>
                <td>
                    <!-- No aggregate condition here: $data is the FactoryPresenter, whose
                         buildings() already returns an AggregateBuildingsCalc (readOnly === true)
                         while aggregating, and constructed-buildings-input branches on that. -->
                    <div data-bind="component: { name: 'constructed-buildings-input', params: $data}"></div>
                </td>
                <td>
                    <!-- ko ifEditable: true -->
                    <btn-default-supplier params="supplier: $data.instance()"></btn-default-supplier>
                    <!-- /ko -->
                </td>
            </tr>
            <!-- ko if: $data.isCapacityUtilizationVisible()  -->
            <tr>
                <!-- capacity utilization -->
                <td>
                    <span data-bind="text: $root.texts.capacityUtilisation.name"></span>
                </td>
                <td>
                    <div data-bind="text: formatPercentage(100 * $data.buildings().capacityUtilisation(), false)"></div>
                </td>
                <td>
                    <!-- ko ifEditable: true -->
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input"
                               data-bind="checked: $data.instance().buildings.fullyUtilizeConstructed,
                                          attr: {id: $data.instance().guid + '-fully-utilize'}" />
                        <label class="custom-control-label"
                               data-bind="text: $root.texts.fullyUtilize.name,
                                          attr: {for: $data.instance().guid + '-fully-utilize'}"></label>
                    </div>
                    <!-- /ko -->
                </td>
            </tr>
            <!-- /ko -->
            <!-- ko if: isProductivityVisible() -->
            <tr>
                <!-- productivity -->
                <td>
                    <span data-bind="text: $root.texts.productivity.name"></span>
                </td>
                <td>
                    <div data-bind="text: formatNumber(100 * $data.boost()) + '%', attr: {title: $root.texts.productivity.name()}"></div>
                </td>
                <td>
                    <!-- ko ifEditable: true -->
                    <div class="inline-list float-right">
                        <!-- aqueduct buff -->
                        <div data-bind="with: $data.instance().aqueductBuff" style="float: right;">
                            <div class="inline-list">
                                <div data-bind="component: {name: 'icon-checkbox', params: {asset: $data.buff, checked: $data.scaling, id: $data.target.guid + '-aqueduct-buff'}}"></div>
                            </div>
                        </div>

                        <!-- modules -->
                        <div class="inline-list" data-bind="foreach: $data.instance().modules.filter(m => m.visible())">
                            <div data-bind="component: {name: 'icon-checkbox', params: {asset: $data, checked: $data.checked, id: $parent.guid() + '-' + $data.guid}}"></div>
                            <span class="ml-1" data-bind="text: $data.name"></span>
                        </div>


                    </div>
                    <!-- /ko -->
                </td>
            </tr>
            <!-- /ko -->
            <!-- ko if: $data.instance().neededFertility -->
            <tr>
                <!-- required fertility -->
                <td>
                    <span data-bind="text: $root.texts.fertility.name"></span>
                </td>
                <td>
                    <img class="icon-sm mr-1" data-bind="attr: { src: $data.instance().neededFertility.icon ? $data.instance().neededFertility.icon : null, alt: $data.instance().neededFertility.name }">
                    <span class="mr-4" data-bind="text: $data.instance().neededFertility.name"></span>
                </td>
                <td>
                    <div class="inline-list-centered">

                        <!-- ko ifEditable: true -->
                        <!-- ko with: $data.showFertilityCheckbox() -->
                        <div class="inline-list-centered">
                            <input type="checkbox" data-bind="checked: $data.checked, attr: { id: 'fert-config-' + $data.fertility.guid }">
                            <label class="ml-1 mb-0" data-bind="text: $root.texts.availableOnIsland.name, attr: { for: 'fert-config-' + $data.fertility.guid }"></label>
                        </div>
                        <!-- /ko -->
                        <!-- /ko -->
                    </div>
                </td>
            </tr>
            <!-- /ko -->
            <tr data-bind="debug: 'Workforce Demand', with: $data.instance().workforceDemand">
                <!-- workforce -->
                <td>
                    <span data-bind="text: $root.texts.workforce.name"></span>
                </td>
                <td></td>
                <td>
                    <div>
                        <span data-bind="text: formatNumber($parent.workforceAmount())"></span>
                        <img class="mr-2 icon-sm icon-light" data-bind="attr: { src: $data.workforce().icon ? $data.workforce().icon : null, alt: $data.workforce().name}">
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- ko ifEditable: true -->
    <div data-bind="if: $data.instance().availableItems().length">
        <collapsible params="id: 'factory-config-equipped-items', heading: $root.texts.itemsEquipped.name, externalLink: 'items', collapsed: true, data: $data.instance()">
            <!-- tri-state legend: Off / Base / Boosted -->
            <div class="text-muted small mb-2" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
                <span style="display: inline-flex; align-items: center; gap: .35rem;">
                    <span class="tri-state-toggle" style="cursor: default;"><span class="tri" data-state="0"></span></span>
                    <span data-bind="text: $root.texts.boostOff.name"></span>
                </span>
                <span style="display: inline-flex; align-items: center; gap: .35rem;">
                    <span class="tri-state-toggle" style="cursor: default;"><span class="tri" data-state="1"></span></span>
                    <span data-bind="text: $root.texts.boostBase.name"></span>
                </span>
                <span style="display: inline-flex; align-items: center; gap: .35rem;">
                    <span class="tri-state-toggle" style="cursor: default;"><span class="tri" data-state="2"></span></span>
                    <span data-bind="text: $root.texts.boostBoosted.name"></span>
                </span>
            </div>
            <table class="table table-striped">
                <tbody data-bind="foreach: $data.availableItems">
                    <tr data-bind="debug: 'Available Item'">
                        <td>
                            <div class="inline-list">
                                <!-- ko ifEditable: true -->
                                <tri-state-toggle params="asset: $data.parent,
                                                          state: $data.parent.slotStates.get($data.target),
                                                          hasBoost: $data.parent.boostEquipments.length > 0,
                                                          id: 'fc-' + $data.target.guid + '-' + $data.parent.guid + '-equipped'"></tri-state-toggle>
                                <!-- /ko -->
                                <span class="ml-1" data-bind="text: $data.parent.name, attr: {for: 'fc-' + $data.target.guid + '-' + $data.parent.guid + '-equipped'}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="buff-list">
                                <!-- base productivity -->
                                <div data-bind="if: $data.activeBuff().baseProductivityUpgrade != 0, attr:{title: $root.texts.productivity.name()}">
                                    <span data-bind="text: formatNumber($data.activeBuff().baseProductivityUpgrade, true) + ' %'"></span>
                                    <img class="icon-sm" src="../icons/icon_2d_productivity_0.webp"></span>
                                </div>
                                <!-- productivity -->
                                <div data-bind="if: $data.activeBuff().productivityUpgrade != 0, attr:{title: $root.texts.productivity.name()}">
                                    <span data-bind="text: formatNumber($data.activeBuff().productivityUpgrade, true) + ' %'"></span>
                                    <img class="icon-sm" src="../icons/icon_2d_productivity_0.webp"></span>
                                </div>
                                <!-- fuel upgrade-->
                                <div data-bind="debug: 'Fuel duration',if: $data.activeBuff().fuelDurationPercent != 0, attr:{title: $root.texts.fuelEfficiency.name()}">
                                    <span data-bind="text: formatNumber($data.activeBuff().fuelDurationPercent, true) + ' % s /'"></span>
                                    <img class="icon-sm" src="../icons/icon_3d_charcoal_goods_0.webp"></span>
                                </div>
                                <!-- extra goods -->
                                <span data-bind="if: $data.extraGoods">
                                    <span class="inline-list-centered">
                                        <img class="icon-sm icon-light mr-2" src="../icons/icon_extra_goods.webp" />
                                        <!-- ko foreach: $data.extraGoods -->
                                        <span style="flex: 100 1 auto;"></span>
                                        <span style="flex: auto;" data-bind="visible: $data.product.available()">
                                            <img class="icon-sm" data-bind="attr: { src: $data.product.icon ? $data.product.icon  : null, alt: $data.product.name }" />
                                        </span>
                                        <span style="flex: 100 1 auto;"></span>
                                        <!-- /ko -->
                                    </span>
                                </span>
                                <!-- input replacements -->
                                <div data-bind="if: $data.replacementArray">
                                    <div data-bind="foreach: $data.replacementArray">
                                        <replacement params="{old: $data.old, new: $data.new}"></replacement>
                                    </div>
                                </div>
                                <!-- workforce maintenance -->
                                <div data-bind="if: $data.activeBuff().workforceMaintenanceFactorUpgrade != 0">
                                    <span class="inline-list-centered">
                                        <span data-bind="text: formatNumber($data.activeBuff().workforceMaintenanceFactorUpgrade, true) + ' %'"></span>
                                        <img class="icon-sm icon-light" data-bind="attr: { src: $data.target.workforceDemand.workforce().icon ? $data.target.workforceDemand.workforce().icon  : null, alt: $data.target.workforceDemand.workforce().name }" />
                                    </span>
                                </div>
                                <!-- workforce replacement -->
                                <div data-bind="if: $data.replacingWorkforce && $parent.workforceDemand.defaultWorkforce.guid !== $data.replacingWorkforce">
                                    <replacement params="{old: $parent.workforceDemand.defaultWorkforce, new: $data.replacingWorkforce}"></replacement>
                                </div>
                                <!-- fertility buff -->
                                <div data-bind="if: $data.activeBuff().addedFertility" class="inline-list-centered">
                                    <span data-bind="text: formatNumber($data.activeBuff().fertilityPercent, true) + ' %'"></span>
                                    <img class="icon-sm ml-1" data-bind="attr: { src: $data.activeBuff().addedFertility.icon ? $data.activeBuff().addedFertility.icon : null, alt: $data.activeBuff().addedFertility.name, title: $data.activeBuff().addedFertility.name }">
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </collapsible>
    </div>
    <!-- /ko -->

    <div data-bind="if: $data.instance().isFactory && $data.instance().extraGoodProductionList && $data.instance().extraGoodProductionList.amount() > ACCURACY">
        <collapsible params="id: 'factory-config-extraGoods', heading: $root.texts.extraGoods.name, collapsed: false, data: $data.instance()">
            <table class="table table-striped">
                <tbody data-bind="foreach: $data.extraGoodProductionList.nonZero">
                    <tr>
                        <td>
                            <img class="icon-sm" data-bind="attr: { src: $data.item.parent.icon ? $data.item.parent.icon : null, alt: $data.item.parent.name}">
                            <img class="icon-sm" data-bind="attr: { src: $data.factory.icon ? $data.factory.icon : null, alt: $data.factory.name}">
                        </td>
                        <td>
                            <div class="float-right">
                                <span data-bind="text: formatNumber($data.amount())"></span>
                                <span> t/min</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </collapsible>
    </div>



    <!-- Production Chain Section -->
    <div data-bind="if: $data.productionChain.tree()">
        <collapsible params="id: 'factory-config-production-chain', heading: $root.texts.production.name, collapsed: false, data: $data, summary: $data.outputAmount">
            <div class="tree" data-bind="with: $data.productionChain.tree()" style="justify-content: center">
                <ul data-bind="template: 'treeElement'"></ul>
            </div>
        </collapsible>
    </div>
</div>
