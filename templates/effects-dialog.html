<div id="effects-dialog" class="modal fade" role="dialog" tabindex="-1" aria-hidden="true" data-bind="debug: 'Effects Dialog'">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h4>
                    <span data-bind="text: $root.texts.effects.name">Effect</span>
                    <external-link params="subpage: 'research'"></external-link>
                </h4>
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>

            </div>
            <div class="modal-body">
                <form class="form form-inline mb-3" style="justify-content: space-between">
                    <input type="text" class="form-control" style="max-width: 50%"
                           data-bind="textInput: $root.effectsFilter.search, attr: {placeholder: $root.texts.effectsSearchPlaceholder.name()}" />
                    <select class="custom-select" style="max-width: 40%" data-bind="value: $root.effectsFilter.source">
                        <option value="all" data-bind="text: $root.texts.effectsFilterAll.name"></option>
                    <option value="mythical-item" data-bind="text: $root.texts.heroicSpecialist.name"></option>
                        <option value="tech" data-bind="text: $root.texts.discovery.name"></option>
                        <option value="festival" data-bind="text: $root.texts.festival.name"></option>
                        <option value="veneration-effect" data-bind="text: $root.texts.venerationEffects.name"></option>
                        <option value="session-event" data-bind="text: $root.texts.sessionEvent.name"></option>
                        <option value="island-event" data-bind="text: $root.texts.islandEvent.name"></option>
                    </select>
                </form>
                <table class="table">
                    <thead style="text-align: center">
                    <tbody data-bind="foreach: $root.filteredEffects">
                        <tr>
                            <td> 
                                <div data-bind="if:$data.isStackable">
                                    <div class="ui-fchain-item-boost">
                                        <div href="#" data-toggle="tooltip">
                                            <div class="input-group input-group-sm mb-3 spinner">
                                                <input class="form-control" style="width: 2rem" type="number" value="0" step="1" min="0" data-bind="value:  $data.scaling, attr: {id: $data.guid + '-scaling-input'}" />
                                                <div class="input-group-append">
                                                    <div data-bind="component: { name: 'number-input-increment', params: { obs: $data.scaling, id: $data.guid + '-scaling-input' }}"></div>
                                                    <span class="input-group-text">x</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div data-bind="if: !$data.isStackable">
                                    <div data-bind="component:{name:'icon-checkbox', params:{asset: $data, checked: $data.scaling}}"></div>
                                </div> 
                            </td>     
                            <td data-bind="text: $data.name"></td> <!-- item name -->
                            <td data-bind="text: $data.getSourceText()"></td> <!-- source type -->
                            <td>
                                <div data-bind="if: $data.targetsIsAllProduction" style="text-align: center;">
                                    <span data-bind="text: $root.texts.allBuildings.name"></span>
                                </div>
                                <div data-bind="if: !$data.targetsIsAllProduction">
                                    <div class="inline-list-centered" data-bind="foreach: $data.targets">
                                        <!-- Residences all share one icon, so show the population-level icon to tell tiers apart. -->
                                        <img class="mr-2 icon-sm" data-bind="attr: { src: $data.populationLevel ? $data.populationLevel.icon : ($data.icon ? $data.icon : null), alt: $data.name, title: $data.getRegionExtendedName()}">
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div data-bind="component: {name: 'buff-display', params: {buffs: $data.buffs}}"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>
